[package]
name = "nikgob-runtime"
description = "Wires library, playback, import and downloads to the view model: executes UI commands, publishes state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
nikgob-view.workspace = true
nikgob-library = { path = "../library" }
nikgob-import = { path = "../import" }
nikgob-metadata = { path = "../metadata" }
nikgob-indexer-prowlarr = { path = "../indexer-prowlarr" }
nikgob-sources = { path = "../sources" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
nikgob-torrent = { path = "../torrent" }
nikgob-soulseek = { path = "../soulseek" }
nikgob-recs = { path = "../recs" }
nikgob-align = { path = "../align" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
fastrand = "2"
jiff = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log.workspace = true
thread-priority = "3"
# mimalloc's collect of a worker's own heap after a burst (heap.rs).
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"], optional = true }

[features]
default = ["mimalloc"]
# The app and nikgobd run on mimalloc and collect a worker's heap after a
# burst; the phone runs on the system allocator, which needs no collect.
mimalloc = ["dep:libmimalloc-sys"]

[target.'cfg(windows)'.dependencies]
# The fullscreen / game check of the background passes (quiet.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# The free space of the music's disks («Загрузки», storage.rs).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
nikgob-core = { workspace = true, features = ["fake"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
hound = "3.5"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros"] }

[lints]
workspace = true
