[package]
name = "nikgobd"
description = "The headless player: the runtime and the engine without a window, for a Raspberry Pi or a server, driven over the API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nikgobd"
path = "src/main.rs"

[dependencies]
nikgob-core.workspace = true
nikgob-view.workspace = true
nikgob-runtime = { path = "../runtime" }
# Without Soloist and SoundCloud's player.
nikgob-playback = { path = "../playback", default-features = false }
nikgob-library = { path = "../library" }
nikgob-audio = { path = "../audio" }
log.workspace = true
env_logger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
