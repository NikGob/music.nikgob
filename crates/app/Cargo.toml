[package]
name = "nikgob"
description = "music.nikgob desktop player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nikgob"
path = "src/main.rs"

[dependencies]
# Gives freed memory back to the system (the system heaps kept it after peaks).
mimalloc = { version = "0.1", default-features = false }
# mimalloc's options, its per-thread collect and its process numbers (the
# same library the allocator above links; v3, as the `v2` feature is off).
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
nikgob-core = { workspace = true, features = ["fake"] }
nikgob-md3e.workspace = true
nikgob-view.workspace = true
nikgob-runtime = { path = "../runtime" }
nikgob-api = { path = "../api" }
nikgob-mcp = { path = "../mcp" }
nikgob-library = { path = "../library" }
nikgob-recs = { path = "../recs" }
nikgob-audio = { path = "../audio" }
nikgob-playback = { path = "../playback" }
nikgob-spotify = { path = "../spotify" }
nikgob-soloist = { path = "../soloist" }
nikgob-youtube = { path = "../youtube" }
nikgob-deezer = { path = "../deezer" }
nikgob-soundcloud = { path = "../soundcloud" }
nikgob-sources = { path = "../sources" }
nikgob-sc-widget = { path = "../sc-widget" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde_json = "1"
egui.workspace = true
eframe.workspace = true
egui_extras = { workspace = true, features = ["file", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
directories = "6"
blake3 = "1.8"
fastframe-text.workspace = true
fastframe-fonts.workspace = true
# The system fallback faces, chosen as fastframe-fonts does and mapped.
skrifa = "0.44"
memmap2 = "0.9"
fastframe-scroll.workspace = true
fastframe-shell.workspace = true
fastframe-tray.workspace = true
fastframe-now-playing.workspace = true
fastframe-instance.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# The process's private bytes and working set for the memory line
# (ProcessStatus, Threading, Foundation).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# The winit eframe runs on (patched to the fork); for the caption colours.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# The YouTube Music sign-in window (system WebView2, see ytlogin.rs).
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
# The «Запускать вместе с Windows» line under the user's Run key.
windows-registry = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The window on Wayland and X11 (the workspace's eframe has its default
# features off, and with them winit's Linux backends).
eframe = { workspace = true, features = ["wayland", "x11"] }
# The winit eframe runs on (patched to the fork); for the monitor's refresh
# rate, and for drawn Adwaita title bars where a Wayland compositor (GNOME's)
# leaves decorations to the window.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland-csd-adwaita"] }
# The YouTube Music sign-in window (WebKitGTK, see ytlogin.rs) in a GTK
# window of its own: wry's webview runs in GTK's main loop, not winit's.
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
gtk = "0.18"

[build-dependencies]
# The icon inside the .exe (Windows resource compiler).
embed-resource = "3"
