[package]
name = "nikgob-api"
description = "The player's local REST API: control, queue, outputs, library, media with Range, events (SSE), Swagger UI; tokens with presets, kept hashed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
nikgob-view.workspace = true
nikgob-runtime = { path = "../runtime" }
nikgob-library = { path = "../library" }
nikgob-metadata = { path = "../metadata" }
# The sound vectors of similar tracks (the recommendations' index).
nikgob-recs = { path = "../recs" }
# The MCP server `/mcp` serves (and `nikgob mcp` on stdio).
nikgob-mcp = { path = "../mcp" }
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
# `oneshot` of the router, for the in-process calls of the mesh's tunnel.
tower = { version = "0.5", default-features = false, features = ["util"] }
blake3 = "1.8"
form_urlencoded = "1"
# The local hours of the listening report.
jiff = "0.2"
# `/mcp` calls the `/v1` routes in-process (`ServiceExt::oneshot`).
tower = { version = "0.5", default-features = false, features = ["util"] }
# The OpenAPI document of the routes (`/openapi.json`) and Swagger UI on
# `/docs`, its files built in from utoipa-swagger-ui-vendored: nothing is
# downloaded by the build or asked of a CDN at run time.
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
