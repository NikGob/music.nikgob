[package]
name = "nikgob-audio"
description = "Audio engine: Symphonia + pure-Rust Opus decoding, gapless/crossfade, ring-buffered cpal output via fastframe-audio, visualizer tap."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
fastframe-audio = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "alac", "ogg", "vorbis", "wav", "pcm", "aiff", "mkv", "id3v2"] }
ropus = "0.12.18"
rtrb = "0.4"
rubato = "5.0.1"
realfft = "3.5"
crossbeam-channel = "0.5"
thiserror = "2"
thread-priority = "3"

# Not used directly: turns on cpal's `realtime` for fastframe-audio's cpal
# (same version, so the features unify). The WASAPI render thread then joins
# MMCSS's audio class instead of running at normal priority, where a busy
# CPU (sound analysis, torrent hashing) left gaps in the device buffer.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", default-features = false, features = ["realtime"] }

# cpal's PulseAudio backend (pure Rust), which PipeWire serves too: cpal then
# takes it as its default host instead of raw ALSA, so the output follows the
# desktop's default device and the device list holds the desktop's own
# outputs rather than every ALSA plugin and hw: node.
[target.'cfg(target_os = "linux")'.dependencies]
fastframe-audio = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47", features = ["pulseaudio"] }
# The same cpal (features unify), for the devices' ids: a PulseAudio sink
# asked for by its name (`alsa_output.…`) rather than its description.
cpal = { version = "0.18.2", default-features = false, features = ["pulseaudio"] }

[dev-dependencies]
hound = "3.5"
tempfile = "3"
ogg = "0.9"

[lints]
workspace = true
