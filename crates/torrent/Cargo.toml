[package]
name = "nikgob-torrent"
description = "Embedded BitTorrent client (librqbit) with seed policy, for the player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
log.workspace = true
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# tests/udp_errors.rs drives a bare uTP socket; the same version librqbit uses.
librqbit-utp = "0.7"
tokio = { version = "1", features = ["net"] }

[lints]
workspace = true
