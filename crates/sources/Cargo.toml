[package]
name = "nikgob-sources"
description = "Download sources behind the core's Source trait (torrents through the indexer, khinsider, free FLAC services), query variants, matching and the one quality policy that picks among them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
nikgob-metadata = { path = "../metadata" }
log.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["time", "fs", "io-util", "sync", "rt"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
