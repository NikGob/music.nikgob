[package]
name = "nikgob-import"
description = "Import pipeline: probe, fingerprint, identify, quality check, convert to Opus, tag, lay out on disk, derive palette."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
nikgob-library = { path = "../library" }
nikgob-metadata = { path = "../metadata" }
log.workspace = true
material-colors.workspace = true
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "macros"] }
lofty = "0.25"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "alac", "ogg", "vorbis", "wav", "pcm", "aiff", "mkv", "id3v2"] }
rusty-chromaprint = "0.3"
ropus = "0.12.18"
ogg = "0.9"
realfft = "3.5"
ebur128 = "0.1"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
notify = "8"
base64 = "0.22"
thread-priority = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
hound = "3.5"
flacenc = "0.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "macros", "test-util"] }

[lints]
workspace = true
