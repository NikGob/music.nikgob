[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Strict-1.0.0"
publish = false

[workspace.dependencies]
nikgob-core = { path = "crates/core" }
nikgob-motion = { path = "crates/motion" }
nikgob-shapes = { path = "crates/shapes" }
nikgob-md3e = { path = "crates/md3e" }
nikgob-view = { path = "crates/view" }

egui = { version = "0.36.1", default-features = false }
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }
material-colors = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# fastframe: pinned revision, update deliberately.
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47", default-features = false }
fastframe-icons = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "bb79dbddef01e660f9cfc37ccd9dff1c299a8d47" }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2

# The audio engine's per-sample loops (decoder thread and the realtime
# callback) run 2-4x slower unoptimised, which eats into the decoded-audio
# headroom of a dev build; optimise it even in dev.
[profile.dev.package.nikgob-audio]
opt-level = 3

# Same for the sound analysis (downmix and resampling loops, the vector
# index's brute-force passes), which runs in the background of a dev build.
[profile.dev.package.nikgob-recs]
opt-level = 3

# And the lyrics alignment (spectra, the alignment's dynamic programming).
[profile.dev.package.nikgob-align]
opt-level = 3

# The interface draws every frame in its own crates (springs, shape
# morphs, lyrics layout, the tessellated paths of covers and glows): at
# opt-level 0 a Now Playing frame takes about three times as long and the
# animations miss frames, so the app's crates are optimised in dev as well.
[profile.dev.package.nikgob]
opt-level = 2

[profile.dev.package.nikgob-md3e]
opt-level = 2

[profile.dev.package.nikgob-shapes]
opt-level = 2

[profile.dev.package.nikgob-motion]
opt-level = 2

[profile.dev.package.nikgob-view]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# The egui/winit forks fastframe's apps build against (see fastframe README).
[patch.crates-io]
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
# librespot-core 0.8.0 with a one-line fix so it builds next to librqbit (vendor/librespot-core/README.nikgob.md).
librespot-core = { path = "vendor/librespot-core" }
# librqbit-dualstack-sockets 0.7.0 that skips Windows per-datagram UDP receive errors, which
# otherwise stop DHT and uTP for the session (vendor/librqbit-dualstack-sockets/README.nikgob.md).
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
