[package]
name = "nikgob-spotify"
description = "Spotify streaming service: Web API catalogue and library, librespot audio. The only crate that knows about Spotify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
log.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
# librespot speaks Spotify's own protocol: the playback session, audio keys,
# encrypted file downloads and quota-free metadata reads. Its build script
# needs vergen 9.0 (Cargo.lock pins 9.0.6: vergen 9.1 brings a vergen-lib that
# vergen-gitcl 1.0 does not implement).
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = "0.8"
protobuf = "3"
# librespot's hyper-rustls enables ring next to reqwest's aws-lc-rs, so a
# process default provider has to be picked (see `install_crypto_provider`).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
nikgob-audio = { path = "../audio" }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
