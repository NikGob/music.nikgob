[package]
name = "nikgob-library"
description = "Library database: SQLite schema, catalog, search, playlists, likes, history, userdata export/import."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
rusqlite = { version = "0.40", features = ["backup", "bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log.workspace = true

[dev-dependencies]
nikgob-core = { workspace = true, features = ["fake"] }
tempfile = "3"

[lints]
workspace = true
