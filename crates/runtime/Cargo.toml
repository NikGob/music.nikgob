[package]
name = "nikgob-runtime"
description = "Wires library, playback, import and downloads to the view model: executes UI commands, publishes state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
nikgob-view.workspace = true
nikgob-library = { path = "../library" }
nikgob-import = { path = "../import" }
nikgob-metadata = { path = "../metadata" }
nikgob-indexer-prowlarr = { path = "../indexer-prowlarr" }
nikgob-torrent = { path = "../torrent" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
fastrand = "2"
jiff = "0.2"
log.workspace = true

[dev-dependencies]
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
hound = "3.5"
tempfile = "3"

[lints]
workspace = true
