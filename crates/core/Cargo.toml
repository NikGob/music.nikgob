[package]
name = "nikgob-core"
description = "Player core: library, playback state, commands and events. Knows nothing about UI."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `streaming::FakeService`: an in-memory streaming service for tests and demos.
fake = []

[dependencies]
log.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "2"
directories = "6"
uuid = { version = "1", features = ["v7", "serde"] }
# The tokens of the local API (api_token.rs).
blake3 = "1.8"
getrandom = "0.3"
# The checksums of the install script and the builds handed out (releases.rs).
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[lints]
workspace = true
