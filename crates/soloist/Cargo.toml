[package]
name = "nikgob-soloist"
description = "Spotify Soloist, Spotify's official headless player, as the player's Spotify sound: its download and renewal, the child process, its local WebSocket API, and its sound captured into our engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikgob-core.workspace = true
nikgob-audio = { path = "../audio" }
log.workspace = true
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
tempfile = "3"

[lints]
workspace = true
