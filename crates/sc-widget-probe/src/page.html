<!doctype html><meta charset="utf-8"><body>
<iframe id="w" width="400" height="200" allow="autoplay; encrypted-media"
 src="https://w.soundcloud.com/player/?url=__URL__&auto_play=false"></iframe>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
const t0 = performance.now();
function log(...a) {
  const s = ((performance.now() - t0) / 1000).toFixed(2) + ' ' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ');
  window.ipc.postMessage(s);
}
window.onerror = (m, s, l) => log('window.onerror', m, s, l);
log('secure context', window.isSecureContext, 'ua', navigator.userAgent);
const cfg = [{ initDataTypes: ['cenc'], audioCapabilities: [
  { contentType: 'audio/mp4; codecs="mp4a.40.2"', robustness: '' }] }];
(async () => {
  for (const ks of ['com.widevine.alpha', 'com.microsoft.playready', 'com.microsoft.playready.recommendation', 'org.w3.clearkey']) {
    try {
      const a = await navigator.requestMediaKeySystemAccess(ks, cfg);
      log('EME', ks, 'OK', JSON.stringify(a.getConfiguration()));
    } catch (e) { log('EME', ks, 'FAIL', String(e)); }
  }
  for (const rb of ['SW_SECURE_CRYPTO', 'HW_SECURE_ALL']) {
    try {
      const c = JSON.parse(JSON.stringify(cfg));
      c[0].audioCapabilities[0].robustness = rb;
      await navigator.requestMediaKeySystemAccess('com.widevine.alpha', c);
      log('EME widevine robustness', rb, 'OK');
    } catch (e) { log('EME widevine robustness', rb, 'FAIL'); }
  }
})();
const w = SC.Widget(document.getElementById('w'));
let lastLog = -9999;
for (const [name, ev] of Object.entries(SC.Widget.Events)) {
  w.bind(ev, d => {
    if (name === 'PLAY_PROGRESS') {
      if (d.currentPosition - lastLog >= 2000 || d.currentPosition < lastLog) { lastLog = d.currentPosition; log('PLAY_PROGRESS', d.currentPosition, d.relativePosition); }
    } else log(name, d || '');
  });
}
w.bind(SC.Widget.Events.READY, () => {
  w.setVolume(5);
  w.getCurrentSound(s => log('currentSound', s ? { id: s.id, title: s.title, duration: s.duration, policy: s.policy } : null));
  w.getDuration(d => log('duration', d));
  log('calling play');
  w.play();
  setTimeout(() => { w.getVolume(v => log('volume', v)); w.isPaused(p => log('isPaused', p)); }, 5000);
});
setInterval(() => { w.getPosition(p => log('getPosition', p)); }, 4000);
</script>
