[package]
name = "nikgob-soundcloud"
description = "SoundCloud (api-v2 with the web player's client id and the user's own sign-in) as a StreamService: catalogue, account data, AAC streams from HLS."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fastrand = "2"
nikgob-core.workspace = true
log.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
